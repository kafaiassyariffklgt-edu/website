<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1350" role="img" aria-labelledby="title desc">
  <title id="title">Poster Majlis Khatam 2026</title>
  <desc id="desc">Poster grafik hijau dan emas untuk Majlis Khatam 2026, KAFAI As-Syariff Telok Datok.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b4a2e"/>
      <stop offset="0.55" stop-color="#137a4a"/>
      <stop offset="1" stop-color="#0a3d26"/>
    </linearGradient>
    <pattern id="girih" width="90" height="90" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <path d="M45 0 90 45 45 90 0 45Z" fill="none" stroke="#ffe600" stroke-opacity=".10" stroke-width="1.2"/>
      <circle cx="45" cy="45" r="10" fill="none" stroke="#ffe600" stroke-opacity=".12" stroke-width="1"/>
    </pattern>
    <radialGradient id="glow" cx="50%" cy="35%" r="65%">
      <stop offset="0" stop-color="#ffe600" stop-opacity=".20"/>
      <stop offset="1" stop-color="#ffe600" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1080" height="1350" fill="url(#bg)"/>
  <rect width="1080" height="1350" fill="url(#girih)"/>
  <rect width="1080" height="1350" fill="url(#glow)"/>

  <rect x="38" y="38" width="1004" height="1274" rx="22" fill="none" stroke="#ffe600" stroke-width="3"/>
  <rect x="54" y="54" width="972" height="1242" rx="14" fill="none" stroke="#ffe600" stroke-opacity=".45" stroke-width="1"/>

  <g fill="#ffe600">
    <path d="M540 112l9 27 27 9-27 9-9 27-9-27-27-9 27-9z"/>
    <circle cx="492" cy="148" r="4"/>
    <circle cx="588" cy="148" r="4"/>
  </g>

  <text x="540" y="238" text-anchor="middle" fill="#e9f7ee" font-family="Inter, Segoe UI, sans-serif" font-size="28" letter-spacing="7">KAFAI AS-SYARIF TELOK DATOK</text>
  <line x1="300" y1="282" x2="780" y2="282" stroke="#ffe600" stroke-opacity=".6" stroke-width="2"/>

  <text x="540" y="420" text-anchor="middle" fill="#ffe600" font-family="Georgia, serif" font-size="58" font-style="italic" letter-spacing="2">Majlis</text>
  <text x="540" y="560" text-anchor="middle" fill="#ffffff" font-family="Georgia, serif" font-size="128" font-weight="700" letter-spacing="3">Khatam</text>

  <text x="540" y="700" text-anchor="middle" fill="#ffe600" font-family="Inter, Segoe UI, sans-serif" font-size="86" font-weight="700" letter-spacing="14">2026</text>

  <g transform="translate(540 880)" fill="none" stroke="#ffe600" stroke-opacity=".7">
    <circle r="118" stroke-width="1.5"/>
    <circle r="94" stroke-width="1"/>
    <path d="M0-118 102-58 102 58 0 118-102 58-102-58Z" stroke-width="1.5"/>
    <path d="M0-94 81-47 81 47 0 94-81 47-81-47Z" stroke-width="1"/>
  </g>

  <text x="540" y="1030" text-anchor="middle" fill="#e9f7ee" font-family="Amiri, Traditional Arabic, serif" font-size="52" direction="rtl" lang="ar">علمو سينر هيدوڤ</text>
  <text x="540" y="1080" text-anchor="middle" fill="#b9dcc6" font-family="Inter, Segoe UI, sans-serif" font-size="28" letter-spacing="3">ILMU SINAR HIDUP</text>

  <line x1="300" y1="1150" x2="780" y2="1150" stroke="#ffe600" stroke-opacity=".45" stroke-width="1"/>
  <text x="540" y="1210" text-anchor="middle" fill="#d9eee0" font-family="Inter, Segoe UI, sans-serif" font-size="24" letter-spacing="2">KALENDAR PROGRAM SEKOLAH</text>
  <text x="540" y="1250" text-anchor="middle" fill="#9fc9ae" font-family="Inter, Segoe UI, sans-serif" font-size="20" letter-spacing="1">Telok Datok · Banting · Kuala Langat</text>
</svg>
