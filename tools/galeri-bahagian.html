<section class="section galeri" aria-labelledby="galeri-title" data-galeri>
      <div class="container">
        <h2 class="section__title" id="galeri-title">Dari sekolah kami</h2>
        <p class="section__lead">Papan tanda, kawasan sekolah dan pintu masuk KAFA Integrasi
          As-Syariff Telok Datok, Banting.</p>

        <div class="galeri__frame" role="region" aria-roledescription="karusel"
             aria-label="Galeri gambar sekolah">
          <div class="galeri__track" data-galeri-track tabindex="0">
            <figure class="galeri__slide">
              <img src="assets/img/galeri-papan-tanda.jpg" width="1600" height="739"
                   loading="lazy" decoding="async"
                   alt="Papan tanda KAFA Integrasi As-Syariff Telok Datok di dataran sekolah, dengan tulisan WE ♥ KIAS di atasnya.">
              <figcaption class="galeri__caption">Papan tanda KAFA Integrasi As-Syariff Telok Datok di dataran sekolah.</figcaption>
            </figure>
            <figure class="galeri__slide">
              <img src="assets/img/galeri-dron.jpg" width="1600" height="801"
                   loading="lazy" decoding="async"
                   alt="Pemandangan udara bangunan sekolah dan jejantas di tepi jalan raya, dengan sungai dan pokok di belakang.">
              <figcaption class="galeri__caption">Pemandangan udara kawasan sekolah di Telok Datok, Banting.</figcaption>
            </figure>
            <figure class="galeri__slide">
              <img src="assets/img/galeri-pintu-masuk.jpg" width="1600" height="686"
                   loading="lazy" decoding="async"
                   alt="Pintu masuk dan jalan masuk ke kawasan sekolah dengan papan nama hijau di sebelah kanan.">
              <figcaption class="galeri__caption">Pintu masuk dan jalan masuk ke kawasan sekolah.</figcaption>
            </figure>
          </div>

          <button type="button" class="galeri__nav galeri__nav--prev" data-galeri-prev
                  aria-label="Gambar sebelumnya"><span aria-hidden="true">‹</span></button>
          <button type="button" class="galeri__nav galeri__nav--next" data-galeri-next
                  aria-label="Gambar seterusnya"><span aria-hidden="true">›</span></button>
        </div>

        <div class="galeri__bar">
          <div class="galeri__dots" data-galeri-dots></div>
          <button type="button" class="galeri__play" data-galeri-play aria-pressed="false">Jeda</button>
        </div>
        <p class="visually-hidden" data-galeri-status role="status" aria-live="off"></p>
      </div>
    </section>
